<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GhostPiP</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="brand-logo" src="../icons/icon48.png" width="32" height="32" alt="" />
      <div class="brand-text">
        <h1>GhostPiP</h1>
        <span class="brand-sub" data-i18n="popupSubtitle"></span>
      </div>
      <span id="modeBadge" class="badge" role="status"></span>
    </header>

    <div id="engineWarning" class="warning" role="alert" hidden></div>

    <label class="master">
      <span class="label-stack">
        <span class="master-title" data-i18n="masterTitle"></span>
        <small data-i18n="masterHint"></small>
      </span>
      <input id="enabled" class="switch" type="checkbox" role="switch" />
    </label>

    <main class="settings">
      <section class="card" data-i18n-aria-label="sectionBasic">
        <label class="row">
          <span class="row-title"><span data-i18n="clickThrough"></span> <kbd id="kbdClickThrough">Alt+G</kbd></span>
          <input id="clickThrough" class="switch" type="checkbox" role="switch" />
        </label>

        <label class="row">
          <span class="row-title"><span data-i18n="autoDodge"></span> <kbd id="kbdDodge">Alt+Shift+D</kbd></span>
          <input id="dodgeEnabled" class="switch" type="checkbox" role="switch" />
        </label>

        <label class="row">
          <span class="label-stack">
            <span class="row-title"><span data-i18n="peekMode"></span> <kbd id="kbdPeek">Alt+P</kbd></span>
            <small data-i18n="peekModeHint"></small>
          </span>
          <input id="peekEnabled" class="switch" type="checkbox" role="switch" />
        </label>

        <label class="row">
          <span class="label-stack">
            <span class="row-title" data-i18n="mediaRemote"></span>
            <small data-i18n="mediaRemoteHint"></small>
          </span>
          <input id="mediaEnabled" class="switch" type="checkbox" role="switch" />
        </label>

        <label class="row">
          <span class="row-title" data-i18n="showChatFull"></span>
          <input id="showChat" class="switch" type="checkbox" role="switch" />
        </label>

        <label class="row">
          <span class="label-stack">
            <span class="row-title" data-i18n="allSites"></span>
            <small id="allSitesHint" data-i18n="allSitesHint" data-i18n-title="allSitesList"></small>
          </span>
          <input id="allSites" class="switch" type="checkbox" role="switch" />
        </label>

        <div class="opacity-block">
          <div class="opacity-head">
            <label for="opacity" class="row-title" data-i18n="opacity"></label>
            <output id="opacityValue" for="opacity">70%</output>
          </div>
          <input id="opacity" type="range" min="10" max="100" step="5" value="70" aria-describedby="wheelSubHint" />
          <small id="wheelSubHint" class="hint"></small>
        </div>

        <button id="toggleMute" type="button" class="btn">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" />
            <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" />
          </svg>
          <span data-i18n="toggleMute"></span> <kbd id="kbdMute">Alt+M</kbd>
        </button>
      </section>

      <div class="card card-list">
        <details id="dodgeDetails">
          <summary data-i18n="dodgeSettings"></summary>
          <div class="details-body">
            <fieldset class="field">
              <legend data-i18n="dodgeCorners"></legend>
              <div class="corner-grid">
                <label><input type="checkbox" data-corner="TL" /> <span data-i18n="cornerTL"></span></label>
                <label><input type="checkbox" data-corner="TR" /> <span data-i18n="cornerTR"></span></label>
                <label><input type="checkbox" data-corner="BL" /> <span data-i18n="cornerBL"></span></label>
                <label><input type="checkbox" data-corner="BR" /> <span data-i18n="cornerBR"></span></label>
              </div>
              <small class="hint" data-i18n="dodgeCornersHint"></small>
            </fieldset>

            <div class="row">
              <label for="home" class="row-title" data-i18n="homePosition"></label>
              <select id="home">
                <option value="TL" data-i18n="cornerTL"></option>
                <option value="TR" data-i18n="cornerTR"></option>
                <option value="BL" data-i18n="cornerBL"></option>
                <option value="BR" data-i18n="cornerBR"></option>
              </select>
            </div>

            <div class="row">
              <label for="axis" class="row-title" data-i18n="dodgeAxis"></label>
              <select id="axis">
                <option value="free" data-i18n="axisFree"></option>
                <option value="vertical" data-i18n="axisVertical"></option>
                <option value="horizontal" data-i18n="axisHorizontal"></option>
              </select>
            </div>

            <div class="row">
              <label for="style" class="row-title" data-i18n="dodgeStyle"></label>
              <select id="style">
                <option value="move" data-i18n="styleMove"></option>
                <option value="fade" data-i18n="styleFade"></option>
              </select>
            </div>

            <label class="row">
              <span class="label-stack">
                <span class="row-title" data-i18n="autoReturn"></span>
                <small data-i18n="autoReturnHint"></small>
              </span>
              <input id="autoReturn" class="switch" type="checkbox" role="switch" />
            </label>
          </div>
        </details>

        <details id="peekDetails">
          <summary data-i18n="peekSettings"></summary>
          <div class="details-body">
            <div class="row">
              <label for="peekKey" class="row-title" data-i18n="peekKey"></label>
              <select id="peekKey">
                <option value="Alt">Alt</option>
                <option value="Mouse4" data-i18n="peekKeyMouse4"></option>
                <option value="Mouse5" data-i18n="peekKeyMouse5"></option>
                <option value="Backquote">`</option>
                <option value="Ctrl">Ctrl</option>
                <option value="Shift">Shift</option>
                <option value="Ctrl+Alt">Ctrl + Alt</option>
              </select>
            </div>

            <div class="row">
              <label for="peekIdleOpacity" class="row-title" data-i18n="peekIdleOpacity"></label>
              <select id="peekIdleOpacity">
                <option value="0" data-i18n="peekIdleZero"></option>
                <option value="0.05" data-i18n="peekIdleOutline"></option>
              </select>
            </div>

            <div class="row">
              <label for="peekActiveOpacity" class="row-title" data-i18n="peekActiveOpacity"></label>
              <select id="peekActiveOpacity">
                <option value="0.6">60%</option>
                <option value="0.8">80%</option>
                <option value="0.9">90%</option>
                <option value="1">100%</option>
              </select>
            </div>

            <div class="row">
              <span class="row-title" id="hkPeekLabel" data-i18n="peekMode"></span>
              <button type="button" class="hotkey-btn" data-hotkey="peek" id="hkPeek" aria-describedby="hkPeekLabel" data-i18n-title="hotkeyBtnTitle">Alt+P</button>
            </div>
          </div>
        </details>

        <details id="mediaDetails">
          <summary data-i18n="mediaSettings"></summary>
          <div class="details-body">
            <div class="row">
              <label for="seekSec" class="row-title" data-i18n="mediaSeekStep"></label>
              <select id="seekSec">
                <option value="5">5s</option>
                <option value="10">10s</option>
              </select>
            </div>

            <label class="row">
              <span class="row-title" data-i18n="mediaWheelVolume"></span>
              <input id="wheelVolume" class="switch" type="checkbox" role="switch" />
            </label>

            <div class="row">
              <span class="row-title" id="hkPlayPauseLabel" data-i18n="mediaPlayPause"></span>
              <button type="button" class="hotkey-btn" data-hotkey="playPause" id="hkPlayPause" aria-describedby="hkPlayPauseLabel" data-i18n-title="hotkeyBtnTitle">Alt+Space</button>
            </div>

            <div class="row">
              <span class="row-title" id="hkSeekBackLabel" data-i18n="mediaSeekBack"></span>
              <button type="button" class="hotkey-btn" data-hotkey="seekBack" id="hkSeekBack" aria-describedby="hkSeekBackLabel" data-i18n-title="hotkeyBtnTitle">Alt+Left</button>
            </div>

            <div class="row">
              <span class="row-title" id="hkSeekForwardLabel" data-i18n="mediaSeekForward"></span>
              <button type="button" class="hotkey-btn" data-hotkey="seekForward" id="hkSeekForward" aria-describedby="hkSeekForwardLabel" data-i18n-title="hotkeyBtnTitle">Alt+Right</button>
            </div>

            <small class="hint" data-i18n="tipMediaHotkeys"></small>
          </div>
        </details>

        <details id="hotkeyDetails">
          <summary data-i18n="hotkeySettings"></summary>
          <div class="details-body">
            <div class="row">
              <label for="hold" class="row-title" data-i18n="holdKey"></label>
              <select id="hold">
                <option value="Ctrl+Alt">Ctrl + Alt</option>
                <option value="Ctrl+Shift">Ctrl + Shift</option>
                <option value="Alt+Shift">Alt + Shift</option>
                <option value="Ctrl">Ctrl</option>
                <option value="Alt">Alt</option>
                <option value="Shift">Shift</option>
              </select>
            </div>

            <div class="row">
              <span class="row-title" id="hkClickThroughLabel" data-i18n="clickThrough"></span>
              <button type="button" class="hotkey-btn" data-hotkey="clickThrough" id="hkClickThrough" aria-describedby="hkClickThroughLabel" data-i18n-title="hotkeyBtnTitle">Alt+G</button>
            </div>

            <div class="row">
              <span class="row-title" id="hkDodgeLabel" data-i18n="autoDodge"></span>
              <button type="button" class="hotkey-btn" data-hotkey="dodge" id="hkDodge" aria-describedby="hkDodgeLabel" data-i18n-title="hotkeyBtnTitle">Alt+Shift+D</button>
            </div>

            <div class="row">
              <span class="row-title" id="hkMuteLabel" data-i18n="mute"></span>
              <button type="button" class="hotkey-btn" data-hotkey="mute" id="hkMute" aria-describedby="hkMuteLabel" data-i18n-title="hotkeyBtnTitle">Alt+M</button>
            </div>

            <ul class="tips">
              <li id="tipHold"></li>
              <li data-i18n="tipNativePip"></li>
              <li id="tipElevated" data-i18n="tipElevated" hidden></li>
            </ul>

            <button id="resetHotkeys" type="button" class="btn btn-sub" data-i18n="resetHotkeys"></button>
          </div>
        </details>
      </div>
    </main>

    <button id="engineBanner" type="button" class="banner">
      <span class="label-stack">
        <strong data-i18n="bannerTitle"></strong>
        <small data-i18n="bannerSub"></small>
      </span>
      <svg class="banner-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
    </button>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
