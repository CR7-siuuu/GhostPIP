<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>GhostPiP</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img class="brand-logo" src="../icons/icon48.png" width="30" height="30" alt="" />
        <div class="brand-text">
          <h1>GhostPiP</h1>
          <span class="brand-sub">Ghost Overlay &amp; Auto-Dodge</span>
        </div>
      </div>
      <span id="modeBadge" class="badge">In-Tab Mode</span>
    </header>

    <div id="engineWarning" class="warning" hidden></div>

    <section class="card">
      <label class="row row-master">
        <div class="label-stack">
          <span>GhostPiP 기능 활성화</span>
          <small>끄면 영상 위 모드 버튼과 오버레이가 숨겨집니다</small>
        </div>
        <input id="enabled" type="checkbox" />
      </label>

      <label class="row">
        <span>클릭 통과 (Ghost Mode) <kbd id="kbdClickThrough">Alt+G</kbd></span>
        <input id="clickThrough" type="checkbox" />
      </label>

      <label class="row">
        <span>스마트 자동 회피 <kbd id="kbdDodge">Alt+Shift+D</kbd></span>
        <input id="dodgeEnabled" type="checkbox" />
      </label>

      <label class="row">
        <span>전체 모드 채팅창 표시</span>
        <input id="showChat" type="checkbox" />
      </label>

      <div class="row">
        <label for="opacity" class="label-stack">
          <span>투명도 <kbd>마우스 휠</kbd></span>
          <small id="wheelSubHint">클릭 통과 시 Ctrl+Alt + 휠</small>
        </label>
        <div class="slider-wrap">
          <input id="opacity" type="range" min="10" max="100" step="5" value="70" />
          <span id="opacityValue">70%</span>
        </div>
      </div>

      <button id="toggleMute" type="button" class="btn">음소거 토글 (<span id="kbdMute">Alt+M</span>)</button>
    </section>

    <details id="hotkeyDetails" class="card">
      <summary>조작키 / 단축키 설정</summary>
      <div class="details-body">
        <label class="row">
          <span>창 조작·휠 홀드 키</span>
          <select id="hold">
            <option value="Ctrl+Alt">Ctrl + Alt</option>
            <option value="Ctrl+Shift">Ctrl + Shift</option>
            <option value="Alt+Shift">Alt + Shift</option>
            <option value="Ctrl">Ctrl 단독</option>
            <option value="Alt">Alt 단독</option>
            <option value="Shift">Shift 단독</option>
          </select>
        </label>

        <div class="row">
          <span>클릭 통과 토글</span>
          <button type="button" class="hotkey-btn" data-hotkey="clickThrough" id="hkClickThrough" title="클릭 후 원하는 단축키를 누르세요">Alt+G</button>
        </div>

        <div class="row">
          <span>자동 회피 토글</span>
          <button type="button" class="hotkey-btn" data-hotkey="dodge" id="hkDodge" title="클릭 후 원하는 단축키를 누르세요">Alt+Shift+D</button>
        </div>

        <div class="row">
          <span>음소거 토글</span>
          <button type="button" class="hotkey-btn" data-hotkey="mute" id="hkMute" title="클릭 후 원하는 단축키를 누르세요">Alt+M</button>
        </div>

        <button id="resetHotkeys" type="button" class="btn btn-sub">단축키 기본값 복원</button>
      </div>
    </details>

    <details id="dodgeDetails" class="card">
      <summary>회피 상세 설정</summary>
      <div class="details-body">
        <div class="field" title="미니맵 위치의 코너를 해제하면 해당 위치로 피하지 않습니다">
          <span>허용 코너 (금지 코너 해제)</span>
          <div class="corner-grid">
            <label title="미니맵 위치의 코너를 해제하면 해당 위치로 피하지 않습니다">
              <input type="checkbox" data-corner="TL" /> TL (좌상)
            </label>
            <label title="미니맵 위치의 코너를 해제하면 해당 위치로 피하지 않습니다">
              <input type="checkbox" data-corner="TR" /> TR (우상)
            </label>
            <label title="미니맵 위치의 코너를 해제하면 해당 위치로 피하지 않습니다">
              <input type="checkbox" data-corner="BL" /> BL (좌하)
            </label>
            <label title="미니맵 위치의 코너를 해제하면 해당 위치로 피하지 않습니다">
              <input type="checkbox" data-corner="BR" /> BR (우하)
            </label>
          </div>
        </div>

        <label class="row">
          <span>기본 코너 (Home)</span>
          <select id="home">
            <option value="TL">TL (좌상)</option>
            <option value="TR">TR (우상)</option>
            <option value="BL">BL (좌하)</option>
            <option value="BR">BR (우하)</option>
          </select>
        </label>

        <label class="row">
          <span>회피 축</span>
          <select id="axis">
            <option value="free">자유 (4방향)</option>
            <option value="vertical">수직 (상하)</option>
            <option value="horizontal">수평 (좌우)</option>
          </select>
        </label>

        <label class="row">
          <span>회피 방식</span>
          <select id="style">
            <option value="move">코너 이동 (Move)</option>
            <option value="fade">투명화 (Fade)</option>
          </select>
        </label>

        <label class="row">
          <span>자동 복귀 (Auto-Return)</span>
          <input id="autoReturn" type="checkbox" />
        </label>
      </div>
    </details>

    <p class="tip">
      • <strong>사이트·브라우저 자체 PiP 버튼</strong>으로 띄운 창에도 투명도·클릭 통과·자동 회피가 적용됩니다.<br />
      • 클릭 통과 중에는 <strong id="tipHoldKey">Ctrl+Alt</strong>를 누른 채로 창 크기·위치 조절 및 <strong>마우스 휠 투명도 조절</strong>이 가능합니다.
    </p>

    <div id="engineBanner" class="banner">
      GhostPiP Engine 다운로드 (PC 게임 오버레이 활성화)
    </div>

    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
