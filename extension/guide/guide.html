<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="guideTitle"></title>
  <link rel="icon" href="../icons/icon32.png" />
  <link rel="stylesheet" href="guide.css" />
</head>
<body>
  <main>
    <header>
      <img src="../icons/icon128.png" alt="" width="56" height="56" />
      <div>
        <h1 data-i18n="guideTitle"></h1>
        <p class="sub" data-i18n="guideSub"></p>
      </div>
      <span id="status" class="status" data-i18n="guideCheckingEngine"></span>
    </header>

    <section class="card">
      <h2 data-i18n="guideStep1Title"></h2>
      <p data-i18n="guideStep1Body"></p>
      <div class="modes">
        <div class="mode">
          <h3 data-i18n="modeFull"></h3>
          <p data-i18n-html="guideFullModeBody"></p>
        </div>
      </div>
    </section>

    <section class="card" id="engineCard">
      <h2 data-i18n="guideStep2Title"></h2>
      <ol>
        <li data-i18n-html="guideStep2a"></li>
        <li data-i18n-html="guideStep2b"></li>
        <li data-i18n-html="guideStep2c"></li>
      </ol>
      <button id="retry" type="button" data-i18n="guideRetry"></button>
      <p class="note" data-i18n-html="guideEngineNote"></p>
    </section>

    <section class="card warn">
      <h2 data-i18n="guideAvTitle"></h2>
      <p data-i18n-html="guideAvBody"></p>
      <ol>
        <li data-i18n-html="guideAv1"></li>
        <li data-i18n-html="guideAv2"></li>
        <li data-i18n-html="guideAv3"></li>
      </ol>
    </section>

    <section class="card">
      <h2 data-i18n="guideControlsTitle"></h2>
      <table>
        <tr><th data-i18n="guideMoveResize"></th><td data-i18n-html="guideMoveResizeHow"></td></tr>
        <tr><th data-i18n="opacity"></th><td data-i18n-html="guideOpacityHow"></td></tr>
        <tr><th data-i18n="guideToggleClickThrough"></th><td><kbd id="hkClick">Alt+G</kbd></td></tr>
        <tr><th data-i18n="guideToggleDodge"></th><td><kbd id="hkDodge">Alt+Shift+D</kbd></td></tr>
        <tr><th data-i18n="mute"></th><td><kbd id="hkMute">Alt+M</kbd></td></tr>
      </table>
      <p class="note" data-i18n="guideHotkeyNote"></p>
    </section>
  </main>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="guide.js"></script>
</body>
</html>
